<style>

#toast div{background:rgba(15,23,42,.92);color:#fff;padding:11px 18px;border-radius:14px;font-size:14px;font-weight:600;box-shadow:0 12px 28px -10px rgba(15,23,42,.5);animation:up .3s both}#toast .warn{background:#B45309}#toast .err{background:#B91C1C}

html[data-big] body{zoom:1.15}

#rep{position:fixed;inset:0;z-index:30;background:var(--bg);overflow:auto;padding:16px}.rp{max-width:820px;margin:0 auto}.rp h1{font-size:22px;margin-bottom:4px}.rp h3{margin-top:16px}.rp p{margin-bottom:4px}

main.in>*{animation:up .4s cubic-bezier(.2,.7,.2,1) both}main.in>:nth-child(2){animation-delay:.05s}main.in>:nth-child(3){animation-delay:.1s}main.in>:nth-child(4){animation-delay:.15s}

</style></head><body>
<header><div class="logo"><i><svg class="i" style="stroke:#fff"><use/></svg></i>MyHealthTracking</div><span class="sp"></span><span class="dt" id="hd"></span>
<button class="ib" aria-label="Alerts" onclick="go('home')" id="bell"></button><button class="ib" aria-label="Profiles" id="av" onclick="profDlg()"></button></header>
<nav id="nav" aria-label="Main"></nav><main id="main"><div class="sk"></div></main><div id="toast" role="status"></div>
<div id="rep" hidden></div><div id="lock" hidden><form onsubmit="return unlock(event)"><h2>MyHealthTracking</h2><p class="ds">Enter your PIN to open the app</p><input id="lpin" type="password" inputmode="numeric" autocomplete="off" maxlength="6" aria-label="PIN"><button class="btn" type="submit">Unlock</button></form></div><dialog id="dlg"></dialog>
<script>
'use strict';
const DEF=()=>({meds:[],rems:[],logs:{},notified:{},labs:[],ills:[],vit:[],appt:[],meals:[],mealPlans:[],snz:{},set:{grace:60,low:5,exp:30,notify:false,refill:7,snz:10,calGoal:2000,carbGoal:250,sugarGoal:30,fiberGoal:28,glGoal:20}});
let PR=null;try{PR=JSON.parse(localStorage.getItem('mht_profiles'))}catch(e){}if(!PR||!Array.isArray(PR.list)||!PR.list.length)PR={list:[{id:'p1',name:'Me'}],cur:'p1'};
const keyFor=id=>id==='p1'?'mht_v1':'mht_v1_'+id;let K=keyFor(PR.cur);const D={};
function loadD(){for(const k in D)delete D[k];Object.assign(D,DEF());try{const s=JSON.parse(localStorage.getItem(K)||'{}');Object.assign(D,s);D.set=Object.assign(DEF().set,s.set)}catch(e){}}
loadD();
let A={theme:'auto',big:false,pin:''};try{Object.assign(A,JSON.parse(localStorage.getItem('mht_app')||'{}'))}catch(e){}
const saveA=()=>localStorage.setItem('mht_app',JSON.stringify(A)),savePR=()=>localStorage.setItem('mht_profiles',JSON.stringify(PR));
const save=()=>{try{localStorage.setItem(K,JSON.stringify(D));gsQueue()}catch(e){toast('Storage is full or blocked','err')}};
const $=s=>document.querySelector(s),pad=n=>String(n).padStart(2,'0'),uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()),today=()=>ymd(new Date());
const IC={home:'M3 11l9-8 9 8v10H3z',inv:'M3 7l9-4 9 4v10l-9 4-9-4zM3 7l9 4 9-4M12 11v10',add:'M12 5v14M5 12h14',rem:'M6 16v-5a6 6 0 0112 0v5l2 2H4zM10 21h4',meals:'M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2H3zm12 0v14a2 2 0 0 0 2 2h2a2 2 0 0 0 2-2V2h-6zM3 19h18v2H3v-2z',health:'M12 21s-8-5-8-11a4.5 4.5 0 018-3 4.5 4.5 0 018 3c0 6-8 11-8 11z',set:'M12 8a4 4 0 100 8 4 4 0 000-8zM12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M5 19l2-2M17 7l2-2'};
const ic=n=>`<svg class="i" viewBox="0 0 24 24"><path d="${IC[n]||IC.add}"/></svg>`;
const PG=[['home','Home'],['inv','Inventory'],['add','Add'],['meals','Meals'],['rem','Reminders'],['health','Health'],['set','Settings']];
let anim=true,page='home',editId=null,F={q:'',s:'',c:'',o:'name',e:''},H={r:7,m:''};
function toast(m,t=''){const e=document.createElement('div');e.textContent=m;e.className=t;$('#toast').append(e);setTimeout(()=>e.remove(),2800)}
function go(p,id=null){anim=true;if(p!=='add'){medRaw='';medLines=[];medImgs=[]}page=p;editId=id;render();scrollTo(0,0)}
const st=m=>m.expiry&&m.expiry<today()?'Expired':m.stock<=0?'Out':m.stock<=m.min?'Low':'In';
const stl={Expired:'Expired',Out:'Out of stock',Low:'Low stock',In:'In stock'};
const dl=m=>m.expiry?Math.round((new Date(m.expiry+'T00:00')-new Date(today()+'T00:00'))/864e5):9999;
function doses(date){const o=[];D.rems.forEach(r=>{if(!r.on)return;const m=D.meds.find(x=>x.id===r.med);if(!m||(r.start&&date<r.start)||(r.end&&date>r.end))return;
if(r.freq==='weekly'&&r.start&&new Date(r.start+'T00:00').getDay()!==new Date(date+'T00:00').getDay())return;o.push({id:r.id+'_'+date,r,m,time:r.time,date})});return o.sort((a,b)=>a.time.localeCompare(b.time))}
function status(d){const l=D.logs[d.id];if(l)return l.status;return Date.now()>new Date(d.date+'T'+d.time).getTime()+D.set.grace*6e4?'missed':'upcoming'}
function find(id){const i=id.lastIndexOf('_'),r=D.rems.find(x=>x.id===id.slice(0,i));if(!r)return;return{id,r,m:D.meds.find(x=>x.id===r.med),time:r.time,date:id.slice(i+1)}}
function act(id,s){const d=find(id);if(!d||!d.m)return;if(D.logs[id])return toast('This dose is already recorded','warn');const q=+d.r.qty||1;
if(s==='taken'){if(d.m.stock-q<0&&!confirm('Stock is lower than this dose. Record it and set stock to 0?'))return;d.m.stock=Math.max(0,d.m.stock-q)}
D.logs[id]={id,status:s,date:d.date,time:d.time,at:new Date().toISOString(),qty:s==='taken'?q:0,name:d.m.name,dose:d.r.dose||'',med:d.m.id};delete D.snz[id];save();toast(s==='taken'?'Dose marked as taken':'Dose skipped');render()}
const row=(d)=>{const s=status(d),open=s==='upcoming'||s==='missed';return `<div class="row"><div class="tm">${d.time}</div><div class="gr"><b>${esc(d.m.name)}</b><small>${esc(d.r.dose||d.m.strength)}, ${d.r.qty} ${esc(d.m.unit)}, ${esc(d.r.ins)}${D.snz[d.id]>Date.now()?', snoozed to '+new Date(D.snz[d.id]).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}):''}</small></div><span class="b ${s}">${s}</span>${open?`<span class="acts"><button class="btn s" onclick="act('${d.id}','taken')">Mark taken</button><button class="btn g" onclick="act('${d.id}','skipped')">Skip</button><button class="btn g" onclick="snooze('${d.id}')">Snooze</button></span>`:''}</div>`};
const empty=(t,b,p)=>`<div class="empty">${t}<br><br><button class="btn" onclick="go('${p}')">${b}</button></div>`;
function alerts(){const a=[];D.meds.forEach(m=>{const s=st(m),n=esc(m.name);if(s==='Expired')a.push(['d',n+' has expired']);else if(s==='Out')a.push(['d',n+' is out of stock']);else if(s==='Low')a.push(['w',n+' is low: '+m.stock+' '+esc(m.unit)+' left']);if(s!=='Expired'&&dl(m)<=D.set.exp)a.push(['w',n+' expires in '+dl(m)+' days']);const dd=dleft(m);if(dd!==null&&dd<=(D.set.refill||7)&&s!=='Out'&&s!=='Expired')a.push(['w',n+' will run out in about '+dd+' day'+(dd===1?'':'s')+'. Plan a refill.'])});return a}

function glucoseCurveSVG(ms){const baseGlu=latestGlucose();const hours=Array.from({length:24},(_,i)=>i);
const pts=hours.map(h=>{let g=baseGlu;ms.forEach(m=>{const mh=+m.time.slice(0,2);const diff=(h-mh+24)%24;if(diff>=0&&diff<=4){const factor=diff<=1?diff:Math.max(0,4-diff)/3;g+=((m.gl||10)*0.25)*factor}});return Math.min(18,Math.max(3.5,g))});
const mn=3,mx=15,xy=(v,i)=>[20+i*260/23,90-(v-mn)/(mx-mn)*75];
const targetY=90-(7.8-mn)/(mx-mn)*75;
return `<svg viewBox="0 0 300 110" style="width:100%;max-width:540px"><line x1="20" y1="${targetY}" x2="280" y2="${targetY}" stroke="#EF4444" stroke-dasharray="4" stroke-width="1.5"/><text x="285" y="${targetY+3}" font-size="8" fill="#EF4444">7.8 mmol/L</text><polyline fill="none" stroke="#2563EB" stroke-width="2.5" points="${pts.map((v,i)=>xy(v,i).join(',')).join(' ')}"/>${pts.filter((_,i)=>i%3===0).map((v,i)=>{const idx=i*3,[x,y]=xy(v,idx);return `<circle cx="${x}" cy="${y}" r="3" fill="#14B8A6"/><text x="${x}" y="${y-6}" font-size="8" text-anchor="middle" fill="currentColor">${v.toFixed(1)}</text>`}).join('')}</svg><p class="ds">Baseline fasting/recent glucose: ${baseGlu} mmol/L. Red dashed line indicates elevated blood sugar threshold (7.8 mmol/L).</p>`}
function latestGlucose(){const g=D.vit.filter(v=>v.type==='glu').sort((a,b)=>(b.date+b.time).localeCompare(a.date+a.time))[0];return g?parseFloat(g.v1)||6.1:6.1}

let medRaw='',medLines=[],medImgs=[];

  $('#dlg').innerHTML=`<h3>Live Camera Scan</h3><div style="text-align:center"><video id="camVid" autoplay playsinline style="width:100%;max-height:280px;background:#000;border-radius:12px"></video><canvas id="camCan" hidden></canvas></div><div class="flex" style="margin-top:10px"><button class="btn" type="button" onclick="snapMedCam()">Capture & Extract</button><button class="btn g" type="button" onclick="$('#dlg').close()">Cancel</button></div>`;
  $('#dlg').showModal();
  try{const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});$('#camVid').srcObject=stream}catch(e){toast('Camera permission denied or unavailable','warn');$('#dlg').close();$('#scg').click()}
}
function snapMedCam(){
  const v=$('#camVid'),c=$('#camCan');if(!v||!v.srcObject)return;c.width=v.videoWidth||640;c.height=v.videoHeight||480;
  c.getContext('2d').drawImage(v,0,0);
  const tracks=v.srcObject.getTracks();tracks.forEach(t=>t.stop());
  c.toBlob(blob=>{const f=new File([blob],'med_capture.jpg',{type:'image/jpeg'});$('#dlg').close();scan([f])},'image/jpeg',0.9);
}
async function scan(files){if(!files.length)return;const box=$('#scs');
if(A.key){try{box.textContent='Smart scan: reading '+(files.length>1?files.length+' photos':'photo')+'...';const o=aiMedMap(await aiCall(files,'med'));files.forEach(f=>medImgs.push(URL.createObjectURL(f)));o._raw='Read by Smart scan (AI). Compare every field with the pack before saving.';o._chk=[];draft=o;toast('Smart scan complete. Verify and save.');go('add');return}catch(e){toast(aiMsg(e)+' Using the offline reader instead.','warn')}}
try{await loadOCR();
for(const [i,file] of files.entries()){const tag=files.length>1?' ('+(i+1)+'/'+files.length+')':'';if(box)box.textContent='Preparing photo'+tag+'...';medImgs.push(URL.createObjectURL(file));
const d=await ocrMulti(await imgCanvas(file),box,tag,'11','6');medLines.push(...d.lines.map(l=>({t:l.text,c:l.confidence})));medRaw+=d.text+'\n'}
if(medRaw.trim().length<2)throw new Error('empty');const o=parseOCR(medRaw);o._raw=medRaw;
o._chk=['name','generic','strength','batch','maker'].map(k=>{if(!o[k])return null;const w=String(o[k]).split(' ')[0].toLowerCase(),l=medLines.find(x=>x.t.toLowerCase().includes(w));return l&&l.c<80?[k,Math.round(l.c)]:null}).filter(Boolean);
draft=o;toast('Scan complete. Review and save.');go('add')}
catch(e){if(box)box.textContent='Take a live photo or choose one from your gallery to extract name, strength, batch and expiry.';toast(e.message==='offline'?'Scanning needs an internet connection the first time you use it':'Could not read the text. Use a close, upright, well-lit photo.','err')}}
if('serviceWorker'in navigator&&location.protocol!=='file:'){navigator.serviceWorker.register('sw.js').catch(()=>{});navigator.serviceWorker.addEventListener('message',e=>{if(e.data&&e.data.id){e.data.act==='snooze'?snooze(e.data.id):act(e.data.id,'taken')}})}
setInterval(tick,20000);setInterval(()=>{if(page==='home'||page==='rem')render()},60000);applyTheme();render();tick();lock();
</script></body></html>
